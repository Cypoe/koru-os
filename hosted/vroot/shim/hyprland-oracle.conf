# hyprland-oracle.conf — nested-Hyprland config for the kv-shim oracle.
# The WAYLAND-1 output is aquamarine's wayland-backend surface, configured
# by the shim at 1280x800. Evidence markers: magenta active border,
# no animation/blur/shadow (deterministic pixels), foot as the real client.
# aq's wayland backend publishes no mode list, so `preferred` resolves to
# 0x0@60 and Hyprland disables the output after 3 retries. An explicit
# mode request takes the custom-mode path (1280x800@0Hz — cosmetic) and
# the monitor becomes valid; without it the render loop never commits.
monitor = WAYLAND-1, 1280x800@60, 0x0, 1

env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = AQ_TRACE,1

debug {
    disable_logs = false
    enable_stdout_logs = true
}

general {
    col.active_border = rgba(ff00ffff)
    col.inactive_border = rgba(333333ff)
    border_size = 4
    gaps_in = 0
    gaps_out = 0
    layout = dwindle
}

decoration {
    rounding = 0
    blur { enabled = false }
    shadow { enabled = false }
}

animations { enabled = false }

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vrr = 0
    vfr = false
}

cursor { no_hardware_cursors = true }

input { kb_layout = us }

exec-once = foot
